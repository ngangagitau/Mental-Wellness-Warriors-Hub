<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Wellness Warriors Hub</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f4f6f9;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Header Styles */
        header {
            text-align: center;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header img {
            height: 60px;
            margin-bottom: 10px;
        }

        /* Menu Styles */
        .menu {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .menu ul {
            list-style: none;
            padding: 0;
            display: flex;
        }

        .menu ul li {
            margin: 0 15px;
            position: relative;
        }

        .menu ul li a {
            font-weight: bold;
            color: #555;
            font-size: 1em;
        }

        .menu ul li a:hover {
            color: #f06292;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5em;
            background: none;
            border: none;
            cursor: pointer;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1100;
        }

        /* Dropdown Styles */
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            list-style: none;
            margin: 0;
            padding: 0;
            min-width: 150px;
        }

        .dropdown-content li {
            border-bottom: 1px solid #eee;
        }

        .dropdown-content li:last-child {
            border-bottom: none;
        }

        .dropdown-content a {
            color: #555;
            padding: 10px 15px;
            display: block;
            font-size: 0.9em;
            text-decoration: none;
        }

        .dropdown-content a:hover {
            background-color: #f4f6f9;
            color: #f06292;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Responsive Menu */
        @media (max-width: 768px) {
            .menu {
                display: none;
                flex-direction: column;
                align-items: flex-start;
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 70%;
                background-color: #ffffff;
                box-shadow: 2px 0 6px rgba(0, 0, 0, 0.2);
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
            }

            .menu.show {
                display: flex;
                transform: translateX(0);
            }

            .menu ul {
                flex-direction: column;
                width: 100%;
            }

            .menu ul li {
                margin: 15px 0;
                text-align: left;
                width: 100%;
                padding: 10px 20px;
            }

            .menu-toggle {
                display: block;
                color: #333;
            }
        }

        /* Hero Section Styles */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            background: #000;
            color: #fff;
            clip-path: ellipse(100% 90% at 50% 10%);
            overflow: hidden;
        }

        .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
        }

        .hero h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .hero button {
            background-color: #ffffff;
            color: #ba68c8;
            padding: 15px 30px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hero button:hover {
            background-color: #ba68c8;
            color: #ffffff;
        }
    </style>
</head>
<body>

<header>
    <img src="pictures/logo.png" alt="Mental Wellness Warriors Hub">
    <button class="menu-toggle" aria-label="Toggle Menu">☰</button>
    <nav class="menu">
        <ul>
            <li><a href="#home">Home</a></li>
            <li class="dropdown">
                <a href="#about">About Us</a>
                <ul class="dropdown-content">
                    <li><a href="AboutUs.html" target="_self">About Us</a></li>
                    <li><a href="Team.html" target="_self">Team</a></li>
                    <li><a href="Gallery.html" target="_self">Gallery</a></li>
                </ul>
            </li>
            <li><a href="Services.html" target="_self">Services</a></li>
            <li><a href="Resources.html" target="_self">Resources</a></li>
            <li><a href="Contact Us.html" target="_self">Contact Us</a></li>
        </ul>
    </nav>
</header>

<section class="hero" id="home">
    <div class="hero-content">
        <h1>Welcome to Mental Wellness Warriors Hub</h1>
        <p>Finding Clarity. Uncovering Solutions.</p>
        <button>Get Started Today</button>
    </div>
</section>

<footer>
    <p>&copy; 2024 Mental Wellness Warriors Hub. All Rights Reserved.</p>
</footer>

<script>
    const menuToggle = document.querySelector('.menu-toggle');
    const menu = document.querySelector('.menu');

    menuToggle.addEventListener('click', () => {
        menu.classList.toggle('show');
    });
</script>

</body>
</html>
