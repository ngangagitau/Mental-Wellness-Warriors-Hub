<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Wellness Warriors Hub</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f4f6f9;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Header Styles */
        header {
            background-color: #ffffff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header img {
            height: 60px;
            margin-bottom: 10px;
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav ul li {
            margin: 5px 0;
        }

        nav ul li a {
            font-weight: bold;
            color: #555;
            font-size: 1em;
        }

        nav ul li a:hover {
            color: #f06292;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5em;
            background: none;
            border: none;
            cursor: pointer;
            position: absolute;
            top: 15px;
            left: 15px;
        }

        /* Menu Styles for Small Screens */
        @media (max-width: 768px) {
            .menu {
                position: fixed;
                top: 0;
                left: -100%;
                width: 250px;
                height: 100%;
                background-color: #ffffff;
                box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
                display: flex;
                flex-direction: column;
                justify-content: start;
                padding-top: 60px;
                gap: 15px;
                transition: left 0.3s ease-in-out;
            }

            .menu.show {
                left: 0;
            }

            nav ul {
                flex-direction: column;
                align-items: flex-start;
                padding-left: 20px;
            }

            .menu-toggle {
                display: block;
            }
        }

        /* Hero Section Styles */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            background: #000;
            color: #fff;
            clip-path: ellipse(100% 90% at 50% 10%);
            overflow: hidden;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .hero button {
            background-color: #ffffff;
            color: #ba68c8;
            padding: 15px 30px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hero button:hover {
            background-color: #ba68c8;
            color: #ffffff;
        }

        /* Section Styles */
        .section {
            padding: 60px 20px;
            text-align: center;
            background-color: #ffffff;
            margin: 20px auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            width: 90%;
            max-width: 1200px;
        }

        .section h2 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #555;
        }

        .section p {
            font-size: 1em;
            color: #666;
            line-height: 1.6;
        }

        /* Footer Styles */
        footer {
            background-color: #333;
            color: #ffffff;
            padding: 20px 0;
            text-align: center;
            font-size: 0.9em;
        }

        footer a {
            color: #f06292;
        }

        footer a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

<header>
    <button class="menu-toggle" aria-label="Toggle Menu">☰</button>
    <img src="pictures/logo.png" alt="Mental Wellness Warriors Hub">
    <nav class="menu">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About Us</a></li>
            <li><a href="Services.html">Services</a></li>
            <li><a href="Resources.html">Resources</a></li>
            <li><a href="Contact Us.html">Contact Us</a></li>
        </ul>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Welcome to Mental Wellness Warriors Hub</h1>
    <p>Finding Clarity. Uncovering Solutions.</p>
    <button>Get Started Today</button>
</section>

<section class="section" id="about">
    <h2>Events</h2>
    <p>Stay tuned for upcoming events!</p>
</section>

<footer>
    <p>&copy; 2024 Mental Wellness Warriors Hub. All Rights Reserved.</p>
</footer>

<script>
    const menuToggle = document.querySelector('.menu-toggle');
    const menu = document.querySelector('.menu');

    menuToggle.addEventListener('click', () => {
        menu.classList.toggle('show');
    });
</script>

</body>
</html>
